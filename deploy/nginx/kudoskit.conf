# Kudos Kit behind nginx on the host (e.g. a server that already runs other sites).
#
#   sudo cp deploy/nginx/kudoskit-ratelimit.conf /etc/nginx/conf.d/
#   sudo cp deploy/nginx/kudoskit.conf /etc/nginx/sites-available/kudoskit
#   sudo sed -i 's/kudoskit.io/YOUR.DOMAIN/' /etc/nginx/sites-available/kudoskit   (if not kudoskit.io)
#   sudo ln -s /etc/nginx/sites-available/kudoskit /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kudoskit.io          adds HTTPS to this file and renews it
#
# Ports 3100 / 3101 are SERVER_PORT / CLIENT_PORT in .env (docker-compose.yml).

server {
    listen 80;
    listen [::]:80;
    server_name kudoskit.io;

    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Exactly one address: the visitor's. Never append a header the visitor sent,
    # or anyone could fake their IP and get around the rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    # The widget sends feedback here, from any website.
    location = /v1/feedback {
        limit_req zone=kudoskit_feedback burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:3100;
    }

    # Sign-in (Better Auth) and the widget script.
    location /api/auth/ {
        proxy_pass http://127.0.0.1:3100;
    }
    location = /kkw.js {
        proxy_pass http://127.0.0.1:3100;
    }

    # Everything else is the dashboard. (The rest of /v1 is internal and not exposed.)
    location / {
        proxy_pass http://127.0.0.1:3101;
    }
}
